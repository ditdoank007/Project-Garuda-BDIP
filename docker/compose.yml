services:

  frontend:
    container_name: bdip-frontend

    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile

    working_dir: /app

    volumes:
      - ../frontend:/app

    env_file:
      - internal-api.env

    environment:
      NEXT_PUBLIC_API_URL: /api
      BDIP_INTERNAL_API_URL: http://backend:8080/api

    ports:
      - "3000:3000"

    depends_on:
      - backend

    restart: unless-stopped

    networks:
      - bdip-net

  backend:
    container_name: bdip-backend

    env_file:
      - backend-db.env
      - internal-api.env

    build:
      context: ..
      dockerfile: docker/backend/Dockerfile

    volumes:
      - /opt/bdip:/opt/bdip:ro

    ports:
      - "8080:8080"

    restart: unless-stopped

    networks:
      - bdip-net

networks:
  bdip-net:
    external: true
